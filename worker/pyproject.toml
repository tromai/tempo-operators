# Testing tools configuration
[project]
name = "tempo-worker-k8s-operator"
version = "0.1.0"
requires-python = "~=3.14.0"

dependencies = [
    "coordinated-workers>=4.1.2",
    "charmed-service-mesh-helpers>=0.2.0",
    "lightkube-extensions",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "coverage[toml]",
    "ops[testing]",
    "pyright",
    "ruff",
    # INTEGRATION TESTS
    "jubilant @ git+https://github.com/tromai/jubilant@improve-jubilant-log",
    "pytest-jubilant @ git+https://github.com/tromai/pytest-jubilant@dump-log-to-logger",
    "requests",
    "minio",
    "tenacity==9.1.2",
    # INTERFACE TESTS
    "pytest-interface-tester",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/**", "lib/**"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"

log_level = "INFO"

log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(name)s %(message)s"

log_file = ".logs/verbose.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_file_date_format = "%Y-%m-%dT%H:%M:%SZ"

# Formatting tools configuration
[tool.black]
line-length = 99
target-version = ["py38"]

# Linting tools configuration
[lint]
line-length = 99
select = ["E", "W", "F", "C", "N", "D", "I001"]
extend-ignore = [
    "D105", # Missing docstring in magic method
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
ignore = ["E501", "D107"]
extend-exclude = ["__pycache__", "*.egg_info"]
per-file-ignores = { "tests/*" = ["D100", "D101", "D102", "D103", "D104"] }

[pydocstyle]
convention = "google"

[tool.pyright]
include = ["src"]
pythonVersion = "3.8"
pythonPlatform = "Linux"

[tool.ruff.lint]
# enforce best practices for logging
# cfr. https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
select = ["G001", "G002", "G003", "G004"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100","D101","D102","D103","D104","G"]
